<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Export Moodle attempt</title>
    <link rel="stylesheet" href="export.css">
    <script type="module" src="export.mjs"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Export Moodle attempt</h1>
      </header>
      <section id="attempt" aria-label="Attempt details" hidden>
        <h2 id="exam"></h2>
        <dl>
          <div><dt id="student-label">Student</dt><dd id="student"></dd></div>
          <div><dt>Questions</dt><dd id="question-count"></dd></div>
        </dl>
        <div class="destination">
          <span class="label">Destination</span>
          <span id="filename">No file selected</span>
        </div>
        <div class="actions">
          <a id="create" class="action-link" hidden>Create JSON file</a>
          <button id="choose" type="button" disabled>Choose JSON file</button>
          <button id="save" type="button" class="primary" disabled>Save attempt</button>
        </div>
      </section>
      <p id="status" role="status" aria-live="polite">Reading the Moodle review…</p>
    </main>
  </body>
</html>
